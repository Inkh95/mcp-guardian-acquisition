<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
  <title id="t">MCP Guardian verified CLI demonstration</title>
  <desc id="d">Terminal-style image showing an unsafe MCP configuration failing with shell, package, credential and permission findings.</desc>
  <rect width="1100" height="520" rx="18" fill="#0b1020"/>
  <rect x="0" y="0" width="1100" height="54" rx="18" fill="#151c31"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f57"/><circle cx="52" cy="27" r="7" fill="#febc2e"/><circle cx="76" cy="27" r="7" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
    <text x="28" y="100" fill="#8be9fd">$ mcp-guardian-scan examples/unsafe-mcp.json</text>
